name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract mobile project
        run: |
          mkdir -p _project
          unzip -q GTA-SA-MP-Shader-Studio-MOBILE-UPLOAD.zip -d _project
          cp -R _project/mobilepack/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-MP-Shader-Studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
